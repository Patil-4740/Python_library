<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update</title>
</head>
<body>
    <form action="{% url 'edit' %}" method="post">
        {% csrf_token %}
        
        <input type="hidden" name="id" value="{{st.id}}"><br>
        <br>

        <label>Name</label><br>
        <input type="text" name="name" placeholder="Name" value="{{st.name}}"><br>
        <br>

        <label>Email</label><br>
        <input type="email" name="email" placeholder="Email" value="{{st.email}}"><br>
        <br>

        <label>Age</label><br>
        <input type="number" name="age" value="{{st.age}}"><br>
        <br>

        <label>Subject</label><br>
        <input type="text" name="subject" placeholder="Subject" value="{{st.subject}}"><br>
        <br>

        <label>Marks</label><br>
        <input type="text" name="marks" placeholder="Marks" value="{{st.marks}}"><br>
        <br>

        <button type="submit">Submit</button>
    </form>

    <br>
    <a href="{% url 'show' %}">View Table</a><br>
    <br>
    <a href="{% url 'analysis' %}">Analysis Table</a>
</body>
</html>
