<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="8px" cellpadding="1px" cellspacing="1px">
        <tr>
            <th>SrNo</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Subject</th>
            <th>Marks</th>
            <th colspan="2">Action</th>
        </tr>
        {% for st in student %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{st.name}}</td>
            <td>{{st.email}}</td>
            <td>{{st.age}}</td>
            <td>{{st.subject}}</td>
            <td>{{st.marks}}</td>
            <td>
                <a href="{% url 'edit' %}?id={{st.id}}">Edit</a>
            </td>
            <td>
                <a href="{% url 'delete' %}?id={{st.id}}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="{% url 'insert' %}">Form</a><br>
    <br>
    <a href="{% url 'student_chart' %}" target="_blank">View Chart</a>
</body>
</html>
